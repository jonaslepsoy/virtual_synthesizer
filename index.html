<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Piano</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Virtual Piano</h1>
    <p class="hint">
      Play with the mouse or your keyboard (Z&ndash;M + S/D/G/H/J lower octave,
      Q&ndash;I + 2/3/5/6/7 upper octave).
      Use the Base Octave fader to set which octave Z and Q start on.
      Drag knobs &amp; faders vertically &middot; scroll to fine-tune &middot; double-click to reset.
    </p>
  </header>

  <main id="controls"></main>

  <section id="drum-machine"></section>

  <section id="piano-container">
    <canvas id="piano"></canvas>
  </section>

  <script src="js/knob.js"></script>
  <script src="js/slider.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/drum-machine.js"></script>
  <script src="js/drum-panel.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
